<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #555;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        
        const grid = 20;
        let count = 0;
        let score = 0;
        let snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
        let dx = grid;
        let dy = 0;
        let food = {x: 320, y: 320};

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function resetGame() {
            snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            dx = grid;
            dy = 0;
            score = 0;
            scoreElement.textContent = 'Score: ' + score;
            spawnFood();
        }

        function spawnFood() {
            food.x = getRandomInt(0, 20) * grid;
            food.y = getRandomInt(0, 20) * grid;
            
            // Don't spawn on snake body
            for (let cell of snake) {
                if (cell.x === food.x && cell.y === food.y) {
                    spawnFood();
                    break;
                }
            }
        }

        function update() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wrap walls
            if (head.x < 0) head.x = canvas.width - grid;
            else if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = canvas.height - grid;
            else if (head.y >= canvas.height) head.y = 0;

            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    resetGame();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = 'Score: ' + score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, grid-1, grid-1);

            ctx.fillStyle = 'lime';
            snake.forEach((cell, index) => {
                // Head is slightly different color
                if (index === 0) ctx.fillStyle = '#ccffcc';
                else ctx.fillStyle = 'lime';
                ctx.fillRect(cell.x, cell.y, grid-1, grid-1);
            });
        }

        function loop() {
            requestAnimationFrame(loop);
            // Slow down game loop to 15fps
            if (++count < 4) return;
            count = 0;

            update();
            draw();
        }

        document.addEventListener('keydown', function(e) {
            // Prevent scrolling
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            if (e.which === 37 && dx === 0) { // left
                dx = -grid; dy = 0;
            }
            else if (e.which === 38 && dy === 0) { // up
                dx = 0; dy = -grid;
            }
            else if (e.which === 39 && dx === 0) { // right
                dx = grid; dy = 0;
            }
            else if (e.which === 40 && dy === 0) { // down
                dx = 0; dy = grid;
            }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
