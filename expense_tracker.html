<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #1a1a2e;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card .value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .card.total .value { color: #4f46e5; }
        .card.monthly .value { color: #10b981; }
        .card.top-category .value { color: #f59e0b; }
        .card.count .value { color: #6366f1; }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .chart-container h3 {
            color: #1a1a2e;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .pie-chart {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 180px;
            padding-top: 20px;
        }

        .bar {
            width: 40px;
            background: linear-gradient(180deg, #4f46e5 0%, #6366f1 100%);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
            position: relative;
        }

        .bar:hover {
            opacity: 0.8;
        }

        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
        }

        .bar-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #1a1a2e;
            font-weight: 600;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            height: fit-content;
        }

        .form-section h2 {
            color: #1a1a2e;
            font-size: 1.25rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-size: 0.875rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #1a1a2e;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-edit {
            background: #fef3c7;
            color: #d97706;
            padding: 8px 12px;
            font-size: 0.8rem;
            margin-right: 8px;
        }

        .btn-edit:hover {
            background: #fde68a;
        }

        .expense-list-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .list-header h2 {
            color: #1a1a2e;
            font-size: 1.25rem;
        }

        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filters input,
        .filters select {
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .filters select {
            min-width: 140px;
        }

        .expense-table {
            width: 100%;
            border-collapse: collapse;
        }

        .expense-table th,
        .expense-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .expense-table th {
            color: #666;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .expense-table tr:hover {
            background: #fafafa;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .category-Food { background: #dbeafe; color: #1d4ed8; }
        .category-Transportation { background: #d1fae5; color: #059669; }
        .category-Entertainment { background: #fef3c7; color: #d97706category-; }
        .Shopping { background: #fce7f3; color: #db2777; }
        .category-Bills { background: #fee2e2; color: #dc2626; }
        .category-Other { background: #f3f4f6; color: #6b7280; }

        .amount {
            font-weight: 600;
            color: #1a1a2e;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .error {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #555;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <div class="dashboard">
            <div class="card total">
                <h3>Total Spending</h3>
                <div class="value" id="totalSpending">$0.00</div>
            </div>
            <div class="card monthly">
                <h3>This Month</h3>
                <div class="value" id="monthlySpending">$0.00</div>
            </div>
            <div class="card top-category">
                <h3>Top Category</h3>
                <div class="value" id="topCategory">-</div>
            </div>
            <div class="card count">
                <h3>Total Expenses</h3>
                <div class="value" id="expenseCount">0</div>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <h3>Spending by Category</h3>
                <div class="pie-chart" id="pieChart"></div>
                <div class="legend" id="pieLegend"></div>
            </div>
            <div class="chart-container">
                <h3>Monthly Trend</h3>
                <div class="bar-chart" id="barChart"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="form-section">
                <h2 id="formTitle">Add Expense</h2>
                <div class="success-message" id="successMessage">Expense saved successfully!</div>
                <form id="expenseForm">
                    <input type="hidden" id="expenseId">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Enter description..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add Expense</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none; margin-top: 10px; width: 100%;">Cancel</button>
                </form>
            </div>

            <div class="expense-list-section">
                <div class="list-header">
                    <h2>Expenses</h2>
                    <div class="filters">
                        <input type="date" id="filterStartDate">
                        <input type="date" id="filterEndDate">
                        <select id="filterCategory">
                            <option value="">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                        <button class="btn btn-secondary" id="exportBtn">Export CSV</button>
                    </div>
                </div>
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody">
                    </tbody>
                </table>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                    <p>No expenses yet. Add your first expense!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'expenses';
        const categoryColors = {
            'Food': '#3b82f6',
            'Transportation': '#10b981',
            'Entertainment': '#f59e0b',
            'Shopping': '#ec4899',
            'Bills': '#ef4444',
            'Other': '#6b7280'
        };

        let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        function saveExpenses() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
        }

        function formatCurrency(amount) {
            return '$' + amount.toFixed(2);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getCurrentMonth() {
            const now = new Date();
            return now.getMonth();
        }

        function getCurrentYear() {
            return new Date().getFullYear();
        }

        function updateDashboard() {
            const total = expenses.reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('totalSpending').textContent = formatCurrency(total);

            const currentMonth = getCurrentMonth();
            const currentYear = getCurrentYear();
            const monthlyExpenses = expenses.filter(e => {
                const d = new Date(e.date);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            });
            const monthlyTotal = monthlyExpenses.reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('monthlySpending').textContent = formatCurrency(monthlyTotal);

            const categoryTotals = {};
            expenses.forEach(e => {
                categoryTotals[e.category] = (categoryTotals[e.category] || 0) + e.amount;
            });
            const topCat = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1])[0];
            document.getElementById('topCategory').textContent = topCat ? topCat[0] : '-';

            document.getElementById('expenseCount').textContent = expenses.length;

            renderPieChart(categoryTotals);
            renderBarChart();
        }

        function renderPieChart(categoryTotals) {
            const pieChart = document.getElementById('pieChart');
            const legend = document.getElementById('pieLegend');
            pieChart.innerHTML = '';
            legend.innerHTML = '';

            const total = Object.values(categoryTotals).reduce((a, b) => a + b, 0);
            if (total === 0) {
                pieChart.style.background = '#e5e7eb';
                return;
            }

            let currentAngle = 0;
            const conicGradient = Object.entries(categoryTotals).map(([cat, amount]) => {
                const percentage = (amount / total) * 100;
                const angle = (percentage / 100) * 360;
                const color = categoryColors[cat];
                const startAngle = currentAngle;
                currentAngle += angle;
                return `${color} ${startAngle}deg ${currentAngle}deg`;
            }).join(', ');

            pieChart.style.background = `conic-gradient(${conicGradient})`;

            Object.entries(categoryTotals).forEach(([cat, amount]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<span class="legend-color" style="background: ${categoryColors[cat]}"></span> ${cat}: ${formatCurrency(amount)}`;
                legend.appendChild(item);
            });
        }

        function renderBarChart() {
            const barChart = document.getElementById('barChart');
            barChart.innerHTML = '';

            const monthlyData = {};
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const key = d.toLocaleDateString('en-US', { month: 'short' });
                monthlyData[key] = 0;
            }

            expenses.forEach(e => {
                const d = new Date(e.date);
                const key = d.toLocaleDateString('en-US', { month: 'short' });
                if (monthlyData.hasOwnProperty(key)) {
                    monthlyData[key] += e.amount;
                }
            });

            const maxValue = Math.max(...Object.values(monthlyData), 1);

            Object.entries(monthlyData).forEach(([month, amount]) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                const height = (amount / maxValue) * 150;
                bar.style.height = Math.max(height, 5) + 'px';
                bar.innerHTML = `
                    <span class="bar-value">${amount > 0 ? formatCurrency(amount) : ''}</span>
                    <span class="bar-label">${month}</span>
                `;
                barChart.appendChild(bar);
            });
        }

        function getFilteredExpenses() {
            const startDate = document.getElementById('filterStartDate').value;
            const endDate = document.getElementById('filterEndDate').value;
            const category = document.getElementById('filterCategory').value;

            return expenses.filter(e => {
                if (startDate && e.date < startDate) return false;
                if (endDate && e.date > endDate) return false;
                if (category && e.category !== category) return false;
                return true;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function renderExpenseTable() {
            const tbody = document.getElementById('expenseTableBody');
            const emptyState = document.getElementById('emptyState');
            const filtered = getFilteredExpenses();

            tbody.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            filtered.forEach(expense => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${formatDate(expense.date)}</td>
                    <td>${expense.description || '-'}</td>
                    <td><span class="category-badge category-${expense.category}">${expense.category}</span></td>
                    <td class="amount">${formatCurrency(expense.amount)}</td>
                    <td class="actions">
                        <button class="btn btn-edit" onclick="editExpense('${expense.id}')">Edit</button>
                        <button class="btn btn-danger" onclick="deleteExpense('${expense.id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function showSuccess() {
            const msg = document.getElementById('successMessage');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        function resetForm() {
            document.getElementById('expenseForm').reset();
            document.getElementById('expenseId').value = '';
            document.getElementById('formTitle').textContent = 'Add Expense';
            document.getElementById('submitBtn').textContent = 'Add Expense';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('date').valueAsDate = new Date();
        }

        document.getElementById('expenseForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const id = document.getElementById('expenseId').value;
            const date = document.getElementById('date').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;

            if (id) {
                const index = expenses.findIndex(e => e.id === id);
                if (index !== -1) {
                    expenses[index] = { ...expenses[index], date, amount, category, description };
                }
            } else {
                expenses.push({
                    id: generateId(),
                    date,
                    amount,
                    category,
                    description
                });
            }

            saveExpenses();
            updateDashboard();
            renderExpenseTable();
            showSuccess();
            resetForm();
        });

        window.editExpense = function(id) {
            const expense = expenses.find(e => e.id === id);
            if (!expense) return;

            document.getElementById('expenseId').value = expense.id;
            document.getElementById('date').value = expense.date;
            document.getElementById('amount').value = expense.amount;
            document.getElementById('category').value = expense.category;
            document.getElementById('description').value = expense.description;

            document.getElementById('formTitle').textContent = 'Edit Expense';
            document.getElementById('submitBtn').textContent = 'Update Expense';
            document.getElementById('cancelBtn').style.display = 'block';

            document.getElementById('date').scrollIntoView({ behavior: 'smooth' });
        };

        window.deleteExpense = function(id) {
            if (!confirm('Are you sure you want to delete this expense?')) return;
            expenses = expenses.filter(e => e.id !== id);
            saveExpenses();
            updateDashboard();
            renderExpenseTable();
        };

        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        document.getElementById('filterStartDate').addEventListener('change', renderExpenseTable);
        document.getElementById('filterEndDate').addEventListener('change', renderExpenseTable);
        document.getElementById('filterCategory').addEventListener('change', renderExpenseTable);

        document.getElementById('exportBtn').addEventListener('click', function() {
            const filtered = getFilteredExpenses();
            if (filtered.length === 0) {
                alert('No expenses to export!');
                return;
            }

            const headers = ['Date', 'Description', 'Category', 'Amount'];
            const rows = filtered.map(e => [
                e.date,
                `"${(e.description || '').replace(/"/g, '""')}"`,
                e.category,
                e.amount.toFixed(2)
            ]);

            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `expenses_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('date').valueAsDate = new Date();
        updateDashboard();
        renderExpenseTable();
    </script>
</body>
</html>
